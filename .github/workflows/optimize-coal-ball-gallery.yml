name: Optimize coal-ball gallery scans

on:
  push:
    branches:
      - botanical-site-draft
    paths:
      - '.github/workflows/optimize-coal-ball-gallery.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  optimize:
    runs-on: ubuntu-latest
    steps:
      - name: Check out development branch
        uses: actions/checkout@v4
        with:
          ref: botanical-site-draft
          persist-credentials: true
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Pillow
        run: python -m pip install --disable-pip-version-check Pillow==11.3.0
      - name: Compress scans and update Research gallery
        run: python .github/scripts/optimize_coal_ball_gallery.py
      - name: Commit web-ready images and gallery update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add images/coal-ball-plate-*-web.jpg _pages/research.md
          if ! git diff --cached --quiet; then
            git commit -m "Optimize coal-ball gallery scans and enable fast plate turning"
            git push origin HEAD:botanical-site-draft
          fi
